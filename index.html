<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bd151d">
  <title>Edgar Perez | Resilient Life Safety IQ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <section class="top">
      <img class="logo" src="images/RLS_DBC_logo_1.svg" alt="Resilient Life Safety IQ logo">
		
<div class="logo-separator"></div>

      <h1>EDGAR PEREZ</h1>
      <p class="role">ENGINEER MANAGEMENT</p>
    </section>
    <div class="curve curve-red" aria-hidden="true"></div>
    <div class="curve curve-gray" aria-hidden="true"></div>
    <section class="bottom" aria-label="Contact options">
      <button class="save" id="saveContact" type="button">SAVE CONTACT</button>
      <div class="actions">
       
<a class="action" id="callLink" href="tel:+13136185979" aria-label="Call Edgar">
  <span class="circle">
    <img src="images/RLS_DBC_call_icon.svg" alt="">
  </span>
  <span>Call</span>
</a>

        
<a class="action" id="emailLink" href="mailto:edgar@rlsiq.com" aria-label="Email Edgar">
  <span class="circle">
    <img src="images/RLS_DBC_email_icon.svg" alt="">
  </span>
  <span>Email</span>
</a>

<a class="action" id="websiteLink" href="https://rlsiq.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit website">
  <span class="circle">
    <img src="images/RLS_DBC_web_icon.svg" alt="">
  </span>
  <span>Website</span>
</a>

      </div>
      <p class="note" id="notice" role="status" aria-live="polite"></p>
    </section>
    <footer class="social">
      <a id="facebookLink" href="#" aria-label="Facebook">f</a>
      <a id="instagramLink" href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <a id="linkedinLink" href="#" aria-label="LinkedIn">in</a>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
